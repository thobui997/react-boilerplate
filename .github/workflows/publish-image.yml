name: Publish image

# Khi push tag `v*` (ví dụ v1.2.0): build image client và đẩy lên GitHub Container Registry.
# Chỉ dùng GITHUB_TOKEN có sẵn; không cần secret nào khác, không cần runner tự host.
# Image: ghcr.io/<owner>/<repo>:<tag> (kèm tag trôi `latest`).
# Muốn nhúng VITE_API_BASE khác mặc định, thêm `build-args: VITE_API_BASE=...` ở bước build.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
