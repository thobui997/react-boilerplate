# Phục vụ bản build (dist/) trong image client. Reverse proxy phía trước chuyển /api tới API.
#
# Lưu ý: add_header trong một `location` ghi đè toàn bộ header cấp server, nên mỗi location
# có add_header phải lặp lại X-Content-Type-Options và Content-Security-Policy.
#
# CSP: template không có style inline nên `style-src 'self'` đủ chặt. Nếu thư viện UI chèn
# style inline (thẻ <style> hoặc thuộc tính style), nới thành `style-src 'self' 'unsafe-inline'`
# ở MỌI location bên dưới.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api không thuộc client: không trả index.html (lỗi cấu hình proxy phải lộ ra thành 404).
    location /api/ {
        return 404;
    }

    # Tệp băm theo nội dung: cache lâu.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # index.html phải luôn được kiểm lại để bản mới tới được người dùng.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA fallback: deep-link (/items/:id...) trả index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
